<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- Empty icon: no favicon request, so no 404 in the network panel. -->
		<link rel="icon" href="data:," />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Infinite Procedural World</title>
		<script>
			// Starts the default airplane download while the main bundle loads.
			// The path is the default model's in src/airplaneModels.js (checked by
			// test/airplaneModels.test.js); with ?plane= the app may load another
			// model, so the preload is skipped.
			if (!new URLSearchParams(location.search).has('plane')) {
				const link = document.createElement('link')
				link.rel = 'preload'
				link.as = 'fetch'
				link.crossOrigin = 'anonymous'
				link.href = '/plane-toy/plane-toy-2.glb'
				document.head.appendChild(link)
			}
		</script>
	</head>
	<body style="background-color: #000000">
		<div
			id="loader"
			style="opacity: 0"
			class="absolute w-[200px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50"
		>
			<span class="absolute left-0 w-full bottom-10 text-white text-center"
				>Loading...</span
			>
			<div id="progress" class="h-2 bg-white" style="width: 0%"></div>
		</div>
		<div
			id="play"
			style="opacity: 0"
			class="flex items-center gap-2 max-[240px]:gap-1 fixed z-50 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 cursor-pointer hover:bg-violet-400 transition-colors bg-white p-2 px-4 max-[240px]:px-2 text-2xl max-[240px]:text-sm whitespace-nowrap rounded-lg shadow-lg"
		>
			Start experience
			<span>
				<svg
					xmlns="http://www.w3.org/2000/svg"
					fill="none"
					viewBox="0 0 24 24"
					stroke-width="1.5"
					stroke="currentColor"
					class="w-6 h-6 max-[240px]:w-5 max-[240px]:h-5"
				>
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						d="m9 9 10.5-3m0 6.553v3.75a2.25 2.25 0 0 1-1.632 2.163l-1.32.377a1.803 1.803 0 1 1-.99-3.467l2.31-.66a2.25 2.25 0 0 0 1.632-2.163Zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 0 1-1.632 2.163l-1.32.377a1.803 1.803 0 0 1-.99-3.467l2.31-.66A2.25 2.25 0 0 0 9 15.553Z"
					/>
				</svg>
			</span>
		</div>
		<span
			class="fixed rounded-full flex justify-center items-center w-10 bg-white hover:bg-violet-300 bottom-8 right-8 z-50 cursor-pointer aspect-square"
			id="sound-toggle"
		>
			<svg
				xmlns="http://www.w3.org/2000/svg"
				fill="none"
				viewBox="0 0 24 24"
				stroke-width="1.5"
				stroke="currentColor"
				class="w-6 h-6"
			>
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					d="m9 9 10.5-3m0 6.553v3.75a2.25 2.25 0 0 1-1.632 2.163l-1.32.377a1.803 1.803 0 1 1-.99-3.467l2.31-.66a2.25 2.25 0 0 0 1.632-2.163Zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 0 1-1.632 2.163l-1.32.377a1.803 1.803 0 0 1-.99-3.467l2.31-.66A2.25 2.25 0 0 0 9 15.553Z"
				/>
			</svg>
		</span>
		<script type="module" src="/main.js"></script>
	</body>
</html>
